[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtopdf-skill"
version = "2.0.0"
description = "Standalone headless CLI and Antigravity skill for converting Markdown to print-ready PDFs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "markdown-it-py>=3.0,<5.0",
    "pymupdf>=1.24,<2.0",
    "pyyaml>=6.0,<7.0",
    "pygments>=2.17,<3.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0,<14.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "bandit>=1.7,<2.0",
]

[project.scripts]
mdtopdf = "mdtopdf_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdtopdf_skill = ["assets/*", "assets/katex/*", "assets/katex/fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests requiring a headless Chromium/Edge/Chrome browser",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
