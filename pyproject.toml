[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtopdf-skill"
version = "0.1.0"
description = "Headless CLI and Antigravity skill for converting Markdown to print-ready A4 PDF via mdtopdf_core."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "markdown2pdf @ git+https://github.com/DelMiiYa/Markdown2PDF.git@v1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
]

[project.scripts]
mdtopdf = "mdtopdf_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end tests requiring a headless Chromium/Edge/Chrome browser",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
